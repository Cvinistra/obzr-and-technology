<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10151c"><title>Документы — архив</title>
<style>
:root{--bg:#10151c;--panel:#171e27;--panel2:#1d2631;--stroke:#2a3542;--text:#e8edf3;--muted:#8795a5;--accent:#7ca7f8;--paper:#f4f2ed;--ink:#24272c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% -10%,#24303d 0,transparent 45%),var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);min-height:100vh}
.topbar{height:68px;border-bottom:1px solid #27313d;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,64px);background:#10151cdd;position:sticky;top:0;backdrop-filter:blur(14px);z-index:5}
.brand{display:flex;align-items:center;gap:12px;font-weight:650;letter-spacing:.2px}.brandmark{height:35px;width:35px;border-radius:10px;background:linear-gradient(140deg,#82adff,#5275c9);display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:0 6px 20px #4564a440}.status{color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:#7ac39a}
main{max-width:1160px;margin:0 auto;padding:36px clamp(18px,4vw,48px) 80px}.breadcrumbs{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;margin-bottom:26px;min-height:24px}.crumb{cursor:pointer}.crumb:hover{color:#fff}.slash{opacity:.4}
.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:26px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.6px;color:#8da9d5;margin-bottom:12px}.hero h1{font-size:clamp(28px,4vw,38px);letter-spacing:-1px;margin:0 0 8px;font-weight:680}.sub{color:var(--muted);font-size:14px}.count{border:1px solid var(--stroke);padding:9px 13px;border-radius:11px;color:#b3bdca;font-size:13px;white-space:nowrap}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--stroke);border-bottom:1px solid var(--stroke);padding:14px 0;margin:24px 0}.search{flex:1;min-width:210px;background:#151b23;border:1px solid var(--stroke);color:var(--text);border-radius:10px;padding:11px 14px;outline:none}.search:focus{border-color:#6488c7}.viewlabel{font-size:12px;color:var(--muted);padding-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:16px}.folder-card{border:1px solid #2c3745;background:linear-gradient(160deg,#202a36,#19212b);border-radius:17px;padding:21px;min-height:164px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}.folder-card:hover{transform:translateY(-3px);border-color:#4b6487;box-shadow:0 14px 35px #0003}.folder-card:before{content:'';position:absolute;width:120px;height:100px;background:#6688c51a;filter:blur(40px);right:-20px;top:-15px}.folder-icon{height:58px;width:74px;position:relative;margin-bottom:16px}.folder-icon:before{content:'';position:absolute;left:3px;top:6px;width:31px;height:13px;border-radius:5px 5px 0 0;background:#7d9dd4}.folder-icon:after{content:'';position:absolute;left:0;top:15px;width:72px;height:43px;border-radius:8px;background:linear-gradient(150deg,#7798ce,#526f9f);box-shadow:inset 0 1px #a6bde0}.folder-icon .fold{position:absolute;z-index:2;left:9px;top:21px;width:60px;height:30px;border-radius:5px;background:linear-gradient(130deg,#a8bee0,#7d9ac9);opacity:.62}.folder-card h3{font-size:16px;margin:0 0 6px;font-weight:600}.folder-card p{margin:0;color:var(--muted);font-size:13px}.meta{position:absolute;right:18px;bottom:19px;color:#718094;font-size:12px}
.file-list{border:1px solid var(--stroke);border-radius:15px;overflow:hidden;background:#151b23}.file-row{display:flex;align-items:center;gap:16px;padding:16px 19px;border-bottom:1px solid #26313d;cursor:pointer;transition:.16s}.file-row:last-child{border-bottom:0}.file-row:hover{background:#1e2834}.file-icon{width:43px;height:49px;border-radius:9px;background:#293747;display:grid;place-items:center;flex-shrink:0;color:#a8c7ff;position:relative;font-size:12px;font-weight:700}.file-icon.doc:after{content:'';position:absolute;width:12px;height:12px;right:0;top:0;background:#17212b;border-left:1px solid #41556b;border-bottom:1px solid #41556b;clip-path:polygon(0 0,100% 100%,0 100%)}.file-details{flex:1;min-width:0}.file-details b{display:block;font-size:14px;font-weight:550;margin-bottom:5px}.file-details span{font-size:12px;color:var(--muted)}.file-date{font-size:12px;color:#8290a0;white-space:nowrap}.arrow{color:#718196;font-size:20px;margin-left:4px}
.sheetgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:17px}.sheetcard{background:#1b232d;border:1px solid #2a3543;border-radius:15px;padding:17px;cursor:pointer;transition:.2s}.sheetcard:hover{transform:translateY(-3px);border-color:#536f9b}.preview{height:190px;background:#eae8e2;border-radius:9px;padding:15px 14px;margin-bottom:14px;box-shadow:0 5px 16px #0002;overflow:hidden;color:#32343a}.mini-top{font-size:8px;color:#777;border-bottom:1px solid #d2d0ca;padding-bottom:7px;margin-bottom:11px}.mini-title{font-size:12px;font-weight:700;margin-bottom:12px}.mini-line{height:4px;background:#c8c6c0;border-radius:5px;margin:7px 0;width:96%}.mini-line.short{width:60%}.mini-line.mid{width:77%}.sheetinfo{display:flex;justify-content:space-between;align-items:center}.sheetinfo b{font-size:14px}.sheetinfo small{color:#8e9aa8;font-size:12px}
.reader-wrap{display:flex;justify-content:center}.paper{background:var(--paper);color:var(--ink);width:min(100%,790px);min-height:870px;padding:clamp(28px,5vw,66px);border-radius:3px;box-shadow:0 22px 70px #0006;line-height:1.7}.paper-head{display:flex;justify-content:space-between;align-items:center;color:#85858a;font-size:11px;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #d5d3cd;padding-bottom:12px;margin-bottom:27px}.paper h2{font-size:24px;line-height:1.3;margin:0 0 22px;font-weight:700}.paper h3{font-size:16px;margin:23px 0 8px}.paper p{font-size:15px;margin:12px 0}.paper ul{padding-left:22px}.paper li{margin:8px 0}.answer{background:#e9e7e1;border-left:3px solid #8697b0;padding:13px 17px;margin:16px 0;border-radius:2px}.reader-nav{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:20px auto 0;max-width:790px}.navbtn{background:#202a35;color:#dce5ef;border:1px solid #344253;border-radius:10px;padding:11px 16px;cursor:pointer}.navbtn:hover{background:#2a3746}.navbtn:disabled{opacity:.4;cursor:default}.page-indicator{font-size:13px;color:var(--muted)}.backbtn{border:1px solid var(--stroke);background:#1a222c;color:#dce5ee;border-radius:9px;padding:9px 13px;cursor:pointer;margin-bottom:16px}.empty{padding:50px;text-align:center;color:var(--muted)}.hidden{display:none!important}.note{color:var(--muted);font-size:13px;margin-top:24px}
@media(max-width:650px){.topbar{height:60px}.status{display:none}main{padding-top:25px}.hero{align-items:flex-start}.count{font-size:11px;padding:7px 10px}.grid{grid-template-columns:1fr}.folder-card{min-height:145px;padding:18px}.sheetgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.preview{height:155px;padding:12px}.paper{min-height:730px;padding:25px 22px}.paper h2{font-size:21px}.paper p,.paper li{font-size:14px}.file-date{display:none}.reader-nav{margin-top:14px}.navbtn{padding:10px 12px;font-size:13px}}
</style></head><body>
<header class="topbar"><div class="brand"><div class="brandmark">D</div> Документы</div><div class="status"><span class="dot"></span> Локальный архив</div></header>
<main><div class="breadcrumbs" id="breadcrumbs"></div><section class="hero"><div><div class="eyebrow">Личный архив · учебные материалы</div><h1 id="heading">Мои папки</h1><div class="sub" id="subtitle">Документы, задания и учебные файлы</div></div><div class="count" id="counter">2 папки</div></section><div class="toolbar" id="toolbar"><input class="search" id="search" placeholder="Поиск по папкам и документам…"><span class="viewlabel">Папки и документы</span></div><div id="content"></div></main>
<script>
const content=document.getElementById('content'),heading=document.getElementById('heading'),subtitle=document.getElementById('subtitle'),counter=document.getElementById('counter'),crumbs=document.getElementById('breadcrumbs'),toolbar=document.getElementById('toolbar'),search=document.getElementById('search');
let view='root',activeSheet=0,searchTerm='';
const pages=[
{title:'Задание 1. Огневые возможности отделения',body:`<h3>Задание</h3><p>Рассмотреть общие возможности подразделения и определить, какие категории целей упоминаются в условии: бронетехника, живая сила, легкобронированные цели и укрытия. Привести по одному общему примеру.</p><h3>Ответ</h3><div class="answer"><p>В условии перечислены разные категории целей: техника, личный состав, легкобронированные объекты и укрытия. Примеры в общем виде — транспортная машина, группа людей, защищённый транспорт и оборудованная позиция. Конкретные способы поражения зависят от обстановки и не рассматриваются в этой работе.</p></div><h3>Почему отделение — минимальная тактическая единица?</h3><div class="answer"><p>Отделение рассматривается как небольшая организованная единица, способная действовать под руководством командира. Его основные признаки: управляемость, взаимодействие участников и мобильность.</p></div>`},
{title:'Задание 2. Анализ боевого порядка',body:`<h3>Задание</h3><p>Представить, что отделение действует в наступлении за БМП. Описать организацию и взаимодействие в общих чертах.</p><h3>Ответ</h3><div class="answer"><p>В учебном описании действия подразделения рассматриваются как согласованная работа группы и экипажа техники. Командир доводит задачу и поддерживает связь с подчинёнными. Участники сохраняют наблюдение за окружающей обстановкой и выполняют распоряжения. Важную роль играют дисциплина, взаимное информирование и соблюдение мер безопасности. Взаимодействие с экипажем техники строится на понятных договорённостях и сигналах. Все действия выполняются в рамках поставленной задачи и под руководством командира.</p></div>`},
{title:'Задание 3А. Диалог командира с командиром взвода',body:`<h3>Творческое мини-задание · вариант А</h3><p>Составить короткий диалог о постановке учебной задачи.</p><div class="answer"><p><b>Командир взвода:</b> Довожу учебную задачу. Нужно организованно пройти указанный участок и отработать взаимодействие.</p><p><b>Командир отделения:</b> Задача понятна. Уточните конечный ориентир и время выполнения.</p><p><b>Командир взвода:</b> Ориентир и время указаны на схеме. При изменениях действовать по команде и поддерживать связь.</p><p><b>Командир отделения:</b> Принял. Проверю готовность группы, связь и понимание порядка действий.</p><p><b>Командир взвода:</b> Перед началом доложите о готовности.</p><p><b>Командир отделения:</b> Есть, доложу. Задачу понял.</p></div>`},
{title:'Задание 3Б. Чек-лист перед выдвижением',body:`<h3>Творческое мини-задание · вариант Б</h3><p>Чек-лист командира перед началом учебного мероприятия:</p><div class="answer"><ul><li>Проверить, что задача и порядок действий всем понятны.</li><li>Убедиться в исправности средств связи.</li><li>Проверить экипировку и одежду по погоде.</li><li>Убедиться в наличии необходимых документов.</li><li>Проверить воду и личные необходимые вещи.</li><li>Провести перекличку, проверить состав группы.</li><li>Уточнить порядок докладов и условные сигналы.</li><li>Проверить готовность транспорта ответственным лицом.</li><li>Напомнить о дисциплине и правилах безопасности.</li><li>Получить подтверждение готовности от участников.</li></ul></div>`}
];
function setView(v){view=v;searchTerm='';search.value='';render()}
function crumb(label,fn){let el=document.createElement('span');el.className='crumb';el.textContent=label;el.onclick=fn;return el}
function renderCrumbs(){crumbs.innerHTML='';crumbs.append(crumb('Архив',()=>setView('root')));
if(view!=='root'){crumbs.append(Object.assign(document.createElement('span'),{className:'slash',textContent:' / '}));crumbs.append(crumb('ОБЗР',()=>setView('folder')))}
if(view==='sheets'||view==='reader'){crumbs.append(Object.assign(document.createElement('span'),{className:'slash',textContent:' / '}));crumbs.append(crumb('ДЗ на 18.11',()=>setView('sheets')))}
if(view==='reader'){crumbs.append(Object.assign(document.createElement('span'),{className:'slash',textContent:' / '}));crumbs.append(crumb('Лист '+(activeSheet+1),()=>{}))}}
function folderCard(name,description,count,onclick){let c=document.createElement('div');c.className='folder-card';c.innerHTML=`<div class="folder-icon"><div class="fold"></div></div><h3>${name}</h3><p>${description}</p><span class="meta">${count}</span>`;c.onclick=onclick;return c}
function fileRow(name,description,tag,date,onclick){let r=document.createElement('div');r.className='file-row';r.innerHTML=`<div class="file-icon doc">${tag}</div><div class="file-details"><b>${name}</b><span>${description}</span></div><div class="file-date">${date}</div><div class="arrow">›</div>`;r.onclick=onclick;return r}
function sheetCard(i){let c=document.createElement('div');c.className='sheetcard';let page=pages[i];let previewLines=i===3?8:i===2?6:4;c.innerHTML=`<div class="preview"><div class="mini-top">ОБЗР · ДОМАШНЯЯ РАБОТА</div><div class="mini-title">${page.title}</div>${Array.from({length:previewLines},(_,k)=>`<div class="mini-line ${k%3===0?'short':k%2?'mid':''}"></div>`).join('')}</div><div class="sheetinfo"><b>Лист ${i+1}</b><small>Открыть лист ›</small></div>`;c.onclick=()=>{activeSheet=i;view='reader';render()};return c}
function render(){renderCrumbs();content.innerHTML='';if(view==='reader'){heading.textContent='Лист '+(activeSheet+1);subtitle.textContent=pages[activeSheet].title;counter.textContent=`${activeSheet+1} из 4`;toolbar.classList.add('hidden');let back=document.createElement('button');back.className='backbtn';back.textContent='← К выбору листов';back.onclick=()=>setView('sheets');content.append(back);let wrap=document.createElement('div');wrap.className='reader-wrap';let paper=document.createElement('article');paper.className='paper';paper.innerHTML=`<div class="paper-head"><span>ОБЗР · ДЗ на 18.11</span><span>Лист ${activeSheet+1}</span></div><h2>${pages[activeSheet].title}</h2>${pages[activeSheet].body}<p style="margin-top:50px;border-top:1px solid #ddd;padding-top:12px;color:#85858a;font-size:11px">Учебный документ · 18 ноября</p>`;wrap.append(paper);content.append(wrap);let nav=document.createElement('div');nav.className='reader-nav';let prev=document.createElement('button');prev.className='navbtn';prev.textContent='← Предыдущий';prev.disabled=activeSheet===0;prev.onclick=()=>{activeSheet--;render()};let indicator=document.createElement('span');indicator.className='page-indicator';indicator.textContent=`Лист ${activeSheet+1} / 4`;let next=document.createElement('button');next.className='navbtn';next.textContent='Следующий →';next.disabled=activeSheet===3;next.onclick=()=>{activeSheet++;render()};nav.append(prev,indicator,next);content.append(nav);return}
 toolbar.classList.remove('hidden');if(view==='root'){heading.textContent='Мои папки';subtitle.textContent='Документы, задания и учебные файлы';counter.textContent='2 папки';let grid=document.createElement('div');grid.className='grid';grid.append(folderCard('ОБЗР','Основы безопасности и защиты Родины','1 документ',()=>setView('folder')),folderCard('Школьные документы','Учебные материалы и заметки','Пусто',()=>{heading.textContent='Школьные документы';subtitle.textContent='Папка пока пустая';counter.textContent='0 файлов';content.innerHTML='<div class="empty">В этой папке пока нет документов.</div>'}));content.append(grid)}else if(view==='folder'){heading.textContent='ОБЗР';subtitle.textContent='Папка с учебными заданиями';counter.textContent='1 файл';let list=document.createElement('div');list.className='file-list';list.append(fileRow('ДЗ на 18.11','Домашнее задание · 4 листа','DOC', '18.11',()=>setView('sheets')));content.append(list)}else if(view==='sheets'){heading.textContent='ДЗ на 18.11';subtitle.textContent='Выберите лист, чтобы открыть его';counter.textContent='4 листа';let grid=document.createElement('div');grid.className='sheetgrid';pages.forEach((_,i)=>grid.append(sheetCard(i)));content.append(grid);let note=document.createElement('div');note.className='note';note.textContent='Выберите один из листов. Переключаться между страницами можно кнопками внизу документа.';content.append(note)}}
search.addEventListener('input',()=>{searchTerm=search.value.trim().toLowerCase();if(view==='root'){render();if(searchTerm){let cards=[...content.querySelectorAll('.folder-card')];cards.forEach(c=>c.style.display=c.textContent.toLowerCase().includes(searchTerm)?'':'none')}}else if(view==='folder'){render();let rows=[...content.querySelectorAll('.file-row')];rows.forEach(r=>r.style.display=r.textContent.toLowerCase().includes(searchTerm)?'':'none')}});
render();
</script></body></html>
